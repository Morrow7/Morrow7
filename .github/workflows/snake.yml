
name: Generate Sakura Glacier Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Pink Blue Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Morrow7
          outputs: |
            dist/pink-blue-snake.svg?color_snake=#EC4899&color_dots=#FFF1F8,#FBCFE8,#F9A8D4,#93C5FD,#3B82F6
            dist/pink-blue-snake-dark.svg?color_snake=#F472B6&color_dots=#0F172A,#334155,#F9A8D4,#60A5FA,#2563EB

      - name: Publish New Snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
