
name: Generate Sakura Glacier Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Pink Blue Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Morrow7
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23EC4899&color_dots=%23FFF1F8,%23FBCFE8,%23F9A8D4,%2393C5FD,%233B82F6
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23F472B6&color_dots=%230F172A,%23334155,%23F9A8D4,%2360A5FA,%232563EB

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
