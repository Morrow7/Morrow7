
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360"
     viewBox="0 0 1200 360"
     role="img"
     aria-label="Morrow animated glacier blue header">

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFF7FD"/>
      <stop offset="48%" stop-color="#DCECF9"/>
      <stop offset="100%" stop-color="#93BFE2"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2563EB" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40"
             patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40"
            fill="none"
            stroke="#4078A7"
            stroke-width=".6"
            opacity=".16"/>
    </pattern>

    <clipPath id="frame">
      <rect width="1200" height="360" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">

    <!-- Glacier background -->
    <rect width="1200" height="360" fill="url(#background)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>

    <!-- Breathing light -->
    <ellipse cx="600" cy="170" rx="390" ry="210"
             fill="url(#glow)">
      <animate attributeName="opacity"
               values=".3;.9;.3"
               dur="7s"
               repeatCount="indefinite"/>
    </ellipse>

    <!-- Floating particles -->
    <g fill="#2563EB">
      <circle cx="100" cy="70" r="2">
        <animate attributeName="opacity"
                 values=".1;.8;.1"
                 dur="3s" repeatCount="indefinite"/>
      </circle>

      <circle cx="260" cy="250" r="2">
        <animate attributeName="cy"
                 values="250;220;250"
                 dur="6s" repeatCount="indefinite"/>
      </circle>

      <circle cx="960" cy="95" r="2">
        <animate attributeName="opacity"
                 values=".8;.1;.8"
                 dur="4s" repeatCount="indefinite"/>
      </circle>

      <circle cx="1080" cy="260" r="2">
        <animate attributeName="cy"
                 values="260;225;260"
                 dur="5s" repeatCount="indefinite"/>
      </circle>

      <circle cx="750" cy="55" r="1.5">
        <animate attributeName="opacity"
                 values=".2;.9;.2"
                 dur="2.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Flowing energy waves -->
    <g fill="none" stroke="url(#beam)">
      <path d="M-100 275 Q220 165 510 270 T1300 225"
            stroke-width="2.5">
        <animateTransform attributeName="transform"
          type="translate"
          values="0 0;0 -18;0 0"
          dur="6s" repeatCount="indefinite"/>
      </path>

      <path d="M-100 310 Q300 200 600 300 T1300 240"
            stroke-width="1.5" opacity=".65">
        <animateTransform attributeName="transform"
          type="translate"
          values="0 0;0 16;0 0"
          dur="8s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Scanline -->
    <rect x="0" y="0" width="1200" height="2"
          fill="#2563EB" opacity=".15">
      <animate attributeName="y"
               values="-2;362"
               dur="9s"
               repeatCount="indefinite"/>
    </rect>

    <!-- Metadata -->
    <g fill="#365E84" font-size="12"
       font-family="monospace">
      <text x="42" y="45">SYS / MORROW</text>
      <text x="1158" y="45" text-anchor="end">STATUS: ONLINE</text>
      <text x="42" y="330">BUILD / LEARN / EVOLVE</text>
      <text x="1158" y="330" text-anchor="end">EST. 2026</text>
    </g>

    <!-- Main title -->
    <text x="600" y="170"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="94"
          font-weight="800"
          letter-spacing="14"
          fill="#17365A">
      MORROW
    </text>

    <text x="600" y="213"
          text-anchor="middle"
          font-family="monospace"
          font-size="17"
          letter-spacing="5"
          fill="#365E84">
      FULL-STACK DEVELOPER / AI BUILDER
    </text>

    <!-- Status -->
    <circle cx="461" cy="254" r="4" fill="#2563EB">
      <animate attributeName="opacity"
               values="1;.2;1"
               dur="2s"
               repeatCount="indefinite"/>
    </circle>

    <text x="485" y="259"
          font-family="monospace"
          font-size="13"
          letter-spacing="2"
          fill="#365E84">
      SYSTEM INITIALIZED
    </text>
  </g>
</svg>
